<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#141619">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Site Survey">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>Vending Survey Table</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icons/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="assets/icons/favicon-16.png" sizes="16x16" type="image/png">
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="auth-overlay hidden" id="authOverlay" role="dialog" aria-modal="true" aria-labelledby="authTitle">
    <form class="auth-card" id="authForm">
      <h2 id="authTitle">Enter Password</h2>
      <p>Unlock Sheet1 table data for this session.</p>
      <input type="password" id="authPassword" autocomplete="current-password" placeholder="Password" required>
      <button type="submit" class="btn btn-primary">Unlock</button>
      <p class="auth-status" id="authStatus" aria-live="polite"></p>
    </form>
  </div>

  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-text">
        <h1>Table Data</h1>
      </div>
      <a class="settings-button" href="index.html" aria-label="Back to survey">
        <span class="material-symbols-rounded">arrow_back</span>
      </a>
    </div>
  </header>

  <main class="container table-page">
    <section class="settings-panel">
      <div class="table-viewer-head">
        <span>
          <strong>Sheet1 rows</strong>
          <small id="tableStatus">Loading...</small>
        </span>
        <button type="button" class="btn btn-secondary btn-small" id="loadTableBtn">
          <span class="material-symbols-rounded btn-icon">refresh</span>
          Reload
        </button>
      </div>
      <div class="table-scroll" id="tableScroll">
        <table class="data-table" id="dataTable"></table>
      </div>
    </section>
  </main>

  <div class="toast hidden" id="toast"></div>

  <script src="assets/config.js"></script>
  <script src="assets/table.js"></script>
</body>
</html>
